# Redeploys https://pointcloud.org/lite/ when the notebook it serves changes.
#
# The JupyterLite site is built in pointcloud.org-infrastructure, but the notebook
# it publishes lives *here* -- one file, so the hosted copy and the copy a reader
# browses on GitHub can't drift apart. The consequence is that a change here has to
# reach across to the other repo, or the site keeps serving the previous notebook
# until someone runs that workflow by hand (which is how it worked when the site
# first shipped, and is exactly the kind of manual step that gets forgotten).
#
# Same dispatch mechanism as manifest-ingest.yml, same INFRA_DISPATCH_TOKEN.
name: Deploy notebook

on:
  push:
    branches: [main]
    paths:
      - "examples/*.ipynb"
  workflow_dispatch:

jobs:
  dispatch:
    # 1 vCPU / 5 GB, $0.002/min. Free on this public repo today, but every job
    # is billed a full minute if this repo's visibility ever changes, and slim
    # also starts faster. Container, not a VM, and capped at 15 minutes: do not
    # move anything needing Docker or a long build here.
    runs-on: ubuntu-slim
    # Explicit cap: GitHub's default job timeout is 360 minutes, so any hang
    # -- a wedged network call, a runner losing its connection -- bills six
    # hours before it is reaped. Nothing here legitimately takes this long.
    timeout-minutes: 5
    steps:
      - name: Dispatch a JupyterLite rebuild to pointcloud.org-infrastructure
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "hobuinc",
              repo: "pointcloud.org-infrastructure",
              event_type: "deploy-jupyterlite",
              client_payload: {
                sha: context.sha,
              },
            });
