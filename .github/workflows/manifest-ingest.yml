# Validates manifests/**/manifest.yaml on every PR that touches
# manifests/, dispatches a dry-run preflight (the real checks against
# pointcloud.org's own infrastructure, reported straight onto the PR)
# on every push while it's still open, then -- once such a PR is
# merged -- fires the real ingest dispatch at pointcloud.org's private
# infrastructure, which does the actual work.
#
# This repo is the public, community-facing half of pointcloud.org:
# anyone can open a PR here adding or editing a dataset under
# manifests/<id>/ (manifest.yaml plus whatever companion files it
# references by relative path -- see README.md), but this repo holds no
# infrastructure secrets or credentials of any kind -- it only holds
# INFRA_DISPATCH_TOKEN, a fine-grained PAT scoped *only* to the private
# infrastructure repo's dispatches endpoint (Contents: Read and write,
# the permission that endpoint checks) -- it cannot read or modify
# anything else there. That's deliberate: any check that needs real
# credentials (does this file exist, do these tiles share a CRS, does
# this PDAL filter list parse) has to happen on the infrastructure side
# of a dispatch, not here, even for a dry-run -- see
# manifests/README.md's "How ingest actually happens" section. Only
# checks needing zero credentials (schema shape, do relative-path
# references exist locally, is a foreign/https URL reachable) run
# directly in this repo, safely runnable for any PR including one from
# a fork.
#
# Jobs are gated by `if:`, not separate `on:` triggers, since several
# need to react to the same `pull_request` event differently depending
# on whether it's an open/update or a merge-close, and GitHub Actions
# can't express "run this job only when merged" (or "only when NOT
# closed") as a top-level `on:` filter.
name: Manifest ingest

on:
  pull_request:
    # "labeled" added for the reingest job below: applying the
    # `reingest` label to an already-merged/closed PR is the trigger
    # for a fresh, no-content-change ingest re-run -- see that job's
    # doc comment.
    #
    # No `paths:` filter (2026-08-10, removed) -- a `labeled` action has
    # no associated commit/diff, so GitHub Actions can't evaluate a
    # `paths` filter against it at all and just silently never runs the
    # workflow (confirmed directly: applying the `reingest` label to a
    # real merged PR produced a real "labeled" timeline event but zero
    # workflow runs, no error, nothing -- `paths` filtering and
    # `labeled`/`unlabeled`/`assigned`-style metadata-only actions are
    # fundamentally incompatible, not a config mistake to fix). Every
    # job below already re-derives "does this PR even touch
    # manifests/?" itself from `changed`'s own PR-files-API call (not
    # GitHub's push-diff paths engine), so removing this costs a few
    # extra cheap `changed`-job runs on PRs that don't touch
    # manifests/ at all, not correctness.
    types: [opened, synchronize, reopened, closed, labeled]
    branches: [main]

jobs:
  # Which dataset directories this PR actually touches -- shared by
  # every other job below so the "changed directory" detection logic
  # (and its schema.json-isn't-a-directory guard, see the comment
  # inside) lives in exactly one place.
  changed:
    # Deliberately no `if:` here (unlike every other job below) --
    # dispatch-ingest only runs on the closed/merged event, and it
    # `needs: changed`. A job whose `needs:` dependency was skipped is
    # itself skipped automatically by GitHub Actions, regardless of its
    # own `if:` -- discovered the hard way when dispatch-ingest silently
    # never fired post-merge because this job used to skip on `closed`
    # too. This job is cheap (one API call), so there's no cost to
    # always computing dataset_ids/manifest_files and letting every
    # downstream job's own `if:` decide whether to act on them.
    runs-on: ubuntu-latest
    outputs:
      dataset_ids: ${{ steps.changed.outputs.dataset_ids }}
      manifest_files: ${{ steps.changed.outputs.manifest_files }}
      removed_dataset_ids: ${{ steps.changed.outputs.removed_dataset_ids }}
      too_many_datasets: ${{ steps.changed.outputs.too_many_datasets }}
    steps:
      - name: Determine which dataset directories this PR changed
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Require at least 3 path segments (manifests/<dir>/<file>)
            // before treating "everything between manifests/ and the
            // filename" as a dataset directory -- otherwise a top-level
            // file directly under manifests/ (e.g. manifests/schema.json,
            // which has only 2 segments) gets mistaken for a directory.
            // Learned from a real failure: PR #5 touched schema.json
            // alongside dataset directories and broke exactly this way.
            //
            // "Dataset directory" here is deliberately just "the
            // filename's own dirname" at ANY depth (2026-08, schema_version
            // 2's grouping-directory support -- e.g.
            // "manifests/usgs-3dep/boston-lot/manifest.yaml" resolves to
            // "usgs-3dep/boston-lot"), not a hardcoded single segment.
            // This assumes contributors only ever put files inside a real
            // LEAF dataset directory, never directly inside a bare
            // grouping directory (manifests/usgs-3dep/ itself never holds
            // its own manifest.yaml or companion files) -- documented in
            // README.md's "Grouping datasets into directories".
            const datasetDirOf = (filename) => filename.split("/").slice(1, -1).join("/");
            const datasetDirFiles = files.filter(
              (f) => f.filename.startsWith("manifests/") && f.filename.split("/").length > 2,
            );
            // A dataset directory counts as "changed" (added/edited) if
            // ANY file under it is still present after this PR -- not
            // just manifest.yaml itself -- since editing a referenced
            // companion file (e.g. a pdal_filters_file JSON) should
            // re-check/re-trigger for that dataset too.
            const datasetIds = [
              ...new Set(
                datasetDirFiles.filter((f) => f.status !== "removed").map((f) => datasetDirOf(f.filename)),
              ),
            ];
            // A dataset directory counts as "removed" only if EVERY file
            // this PR touched under it has status "removed" -- i.e. it's
            // not also in datasetIds above. A PR that deletes one
            // companion file but leaves manifest.yaml (or adds/edits
            // another file) in the same directory is an edit, not a
            // removal, and datasetIds already covers that case.
            const removedDatasetIds = [
              ...new Set(
                datasetDirFiles.filter((f) => f.status === "removed").map((f) => datasetDirOf(f.filename)),
              ),
            ].filter((id) => !datasetIds.includes(id));

            core.setOutput("dataset_ids", JSON.stringify(datasetIds));
            core.setOutput("manifest_files", datasetIds.map((id) => `manifests/${id}/manifest.yaml`).join(" "));
            core.setOutput("removed_dataset_ids", JSON.stringify(removedDatasetIds));
            // One PR may only add, edit, OR remove ONE dataset directory
            // -- see the `reject-multi-dataset-pr` job below, which is
            // the thing that actually acts on this output (posts a
            // comment + fails the check). Computed here, once, rather
            // than repeated as an inline expression on every job below
            // that needs to also refuse to run for a too-many-datasets
            // PR. Counts distinct directories touched at all (added,
            // edited, or removed), not just datasetIds -- a PR that
            // removes one dataset while editing an unrelated one is
            // still two datasets in one PR.
            const totalTouched = new Set([...datasetIds, ...removedDatasetIds]).size;
            core.setOutput("too_many_datasets", totalTouched > 1 ? "true" : "false");

  # A PR that touches more than one dataset directory gets rejected
  # outright -- one PR, one dataset, so review/preflight/ingest stay
  # scoped to a single change a maintainer can reason about (and so a
  # broken dataset never blocks an unrelated one sharing the same PR).
  # This posts the explanation as a sticky comment (same pattern as the
  # preflight/ingest-result comments the infrastructure side posts) and
  # fails the check so it shows up as a red X on the PR, in addition to
  # scripts/validate-manifests.mjs's own refusal (see its doc comment)
  # if `validate` also happens to run against the same file list.
  reject-multi-dataset-pr:
    needs: changed
    if: github.event.action != 'closed' && github.event.action != 'labeled' && needs.changed.outputs.too_many_datasets == 'true'
    runs-on: ubuntu-latest
    # Explicit, in addition to (not instead of) `validate`'s own refusal
    # to run against multiple manifest paths (see
    # scripts/validate-manifests.mjs's doc comment): a PR from a fork
    # gets a read-only GITHUB_TOKEN by GitHub's own platform policy, no
    # matter what's declared here, so the comment/fail steps below can
    # silently fail to post for a fork contributor specifically. This
    # `permissions:` block covers the common case (a same-repo PR, or a
    # maintainer's own branch); `validate` failing is the fallback
    # signal that still works even when this one's comment can't post.
    permissions:
      pull-requests: write
    steps:
      - name: Comment and fail
        uses: actions/github-script@v7
        with:
          script: |
            const datasetIds = [
              ...new Set([...${{ needs.changed.outputs.dataset_ids }}, ...${{ needs.changed.outputs.removed_dataset_ids }}]),
            ];
            const marker = "<!-- pointcloud:too-many-datasets -->";
            const body = [
              marker,
              `This PR touches **${datasetIds.length} dataset directories** (${datasetIds.map((id) => `\`${id}\``).join(", ")}).`,
              "",
              "Each pull request may only add, edit, or remove **one** dataset directory under `manifests/`. Please close this PR and resubmit as separate pull requests, one per dataset.",
            ].join("\n");

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body,
                });
              }
            } catch (err) {
              // Most likely a fork PR's read-only token -- see this
              // job's permissions comment above. Don't let a failed
              // comment post mask the real signal below.
              core.warning(`could not post the too-many-datasets comment: ${err.message}`);
            }

            core.setFailed(`This PR touches ${datasetIds.length} dataset directories -- split it into separate PRs.`);

  # Schema/local-file validation. Scoped to just the dataset(s) this PR
  # changed (via the `changed` job's manifest_files output) -- when
  # manifest_files is empty (e.g. a PR that only touches
  # manifests/schema.json), scripts/validate-manifests.mjs falls back to
  # validating every manifest in the repo instead, since a schema change
  # can break a dataset it didn't directly touch. When manifest_files
  # names more than one dataset, the script refuses outright (see its
  # own doc comment) -- that PR needs `reject-multi-dataset-pr` below,
  # not a real validation run.
  validate:
    needs: changed
    if: github.event.action != 'closed' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (js-yaml, ajv, for the validator)
        run: npm install
      - name: Validate manifest(s)
        run: node scripts/validate-manifests.mjs ${{ needs.changed.outputs.manifest_files }}

  # Foreign/https URL reachability + a resolved-payload-size estimate --
  # both need zero infrastructure credentials (a plain HEAD request, a
  # local JSON.stringify), so they run directly here rather than as
  # part of the credentialed infrastructure-side preflight. Only checks
  # the datasets this PR actually changed, not the whole repo (unlike
  # validate above) -- no reason to re-check a foreign URL nothing in
  # this PR touched.
  check-reachability:
    needs: changed
    if: github.event.action != 'closed' && github.event.action != 'labeled' && needs.changed.outputs.manifest_files != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (js-yaml)
        run: npm install
      - name: Check foreign/https URL reachability + payload size
        run: node scripts/check-reachability.mjs ${{ needs.changed.outputs.manifest_files }}

  # Does this PR's manifest request `dataset.federate: true`? Credential-
  # free (just reading YAML this PR already touched), so runs directly
  # here -- feeds label-and-comment-federate below, which is the thing
  # that actually posts something about it. Kept as its own tiny job
  # (rather than a step inside check-reachability) so its boolean output
  # is easy to depend on independently.
  check-federate:
    needs: changed
    if: github.event.action != 'closed' && github.event.action != 'labeled' && needs.changed.outputs.manifest_files != ''
    runs-on: ubuntu-latest
    outputs:
      federate: ${{ steps.check.outputs.federate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (js-yaml)
        run: npm install
      - name: Check dataset.federate
        id: check
        run: echo "federate=$(node scripts/check-federate.mjs ${{ needs.changed.outputs.manifest_files }})" >> "$GITHUB_OUTPUT"

  # Dry-run counterpart to dispatch-ingest below -- fires on every push
  # to an open PR (not just merge), so a contributor gets real feedback
  # (does this file exist, do these tiles share a CRS, does this PDAL
  # filter list parse) while they're still iterating, not only after
  # merge. Gated on validate passing first: no reason to spend a
  # preflight run on a manifest that's already structurally broken.
  # See manifests/README.md's "How ingest actually happens" section.
  dispatch-preflight:
    needs: [changed, validate]
    if: github.event.action != 'closed' && github.event.action != 'labeled' && needs.changed.outputs.dataset_ids != '[]' && needs.changed.outputs.too_many_datasets != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch preflight to pointcloud.org-infrastructure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "hobuinc",
              repo: "pointcloud.org-infrastructure",
              event_type: "manifest-preflight",
              client_payload: {
                datasetIds: ${{ needs.changed.outputs.dataset_ids }},
                prNumber: ${{ github.event.pull_request.number }},
              },
            });

  dispatch-ingest:
    # Only the merge path dispatches -- a PR that's closed without
    # merging (abandoned) should never kick off ingest.
    needs: changed
    if: github.event.pull_request.merged == true && github.event.action != 'labeled' && needs.changed.outputs.dataset_ids != '[]' && needs.changed.outputs.too_many_datasets != 'true'
    runs-on: ubuntu-latest
    steps:
      # No checkout/npm install here -- this job used to build the full
      # resolved dataset payload (including every asset entry) itself
      # and hand it to the infra repo as `client_payload`, but GitHub
      # rejects a repository_dispatch whose client_payload is too large
      # ("client_payload is too large", a 422) well under the size of
      # even a single real dataset here -- wi-adams-2019's ~1,026
      # hand-authored assets alone serialize to ~150KB, and a PR that
      # touches several dataset directories at once (e.g. one that also
      # edits schema.json, like the PR that first exposed this) makes it
      # worse. client_payload now carries only which dataset IDs changed
      # and the merge commit they changed at -- tiny regardless of how
      # many datasets or how large any one of them is. The infra repo's
      # receive-manifest-dispatch.yml checks out this repo itself at
      # that commit and resolves the real payload there, right before
      # POSTing it to the ingest backend directly (no GitHub API size limit on
      # an ordinary HTTPS POST body).
      - name: Dispatch ingest to pointcloud.org-infrastructure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: "hobuinc",
              repo: "pointcloud.org-infrastructure",
              event_type: "manifest-ingest",
              client_payload: {
                datasetIds: ${{ needs.changed.outputs.dataset_ids }},
                sha: "${{ github.event.pull_request.merge_commit_sha }}",
                prNumber: ${{ github.event.pull_request.number }},
              },
            });

  # A PR that removes an entire dataset directory gets a distinguishing
  # label and a sticky comment explaining what merging it will actually
  # do -- see manifests/README.md's "Removing a dataset" section. This
  # is purely informational (no side effects here); the real removal
  # only happens post-merge, in dispatch-removal below.
  label-and-comment-removal:
    needs: changed
    if: github.event.action != 'closed' && github.event.action != 'labeled' && needs.changed.outputs.removed_dataset_ids != '[]' && needs.changed.outputs.too_many_datasets != 'true'
    runs-on: ubuntu-latest
    # Same fork-PR caveat as reject-multi-dataset-pr above: a fork's
    # default GITHUB_TOKEN is read-only by GitHub platform policy no
    # matter what's declared here, so labeling/commenting can silently
    # fail to post for a fork contributor specifically. Nothing else in
    # this job depends on it succeeding -- dispatch-removal below still
    # fires on merge either way.
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Label PR and post removal notice
        uses: actions/github-script@v7
        with:
          script: |
            const removedIds = ${{ needs.changed.outputs.removed_dataset_ids }};
            const datasetId = removedIds[0];

            try {
              // Adding a label name that doesn't exist yet on this repo
              // auto-creates it (with a default color) -- no separate
              // "ensure label exists" step needed.
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ["removal"],
              });
            } catch (err) {
              core.warning(`could not add the "removal" label: ${err.message}`);
            }

            const marker = "<!-- pointcloud:removal-notice -->";
            const body = [
              marker,
              `### This PR removes \`${datasetId}\` from the archive index`,
              "",
              `Merging this PR deletes \`manifests/${datasetId}/\`, which will:`,
              "",
              `- Drop **${datasetId}** from pointcloud.org's site listing (the site is built directly from this directory, so once it's gone here, it's gone there too).`,
              `- Remove **${datasetId}**'s STAC Collection/Items/GeoParquet from pointcloud.org's infrastructure, and drop it from the root STAC Catalog.`,
              `- Leave **${datasetId}**'s underlying point-cloud data in storage, untouched -- this only removes it from the *index*, it does not delete archived data.`,
            ].join("\n");

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`could not post the removal notice comment: ${err.message}`);
            }

  # Only the merge path dispatches -- an abandoned (closed without
  # merging) removal PR should never actually remove anything, same
  # reasoning as dispatch-ingest above. Dispatches straight to the
  # Worker's /remove endpoint via receive-manifest-removal.yml -- unlike
  # dispatch-ingest, there's no payload to resolve (nothing left to
  # read once the directory's deleted), so this needs no intermediate
  # build-datasets-payload.mjs step, just which dataset id to remove.
  dispatch-removal:
    needs: changed
    if: github.event.pull_request.merged == true && github.event.action != 'labeled' && needs.changed.outputs.removed_dataset_ids != '[]' && needs.changed.outputs.too_many_datasets != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch removal to pointcloud.org-infrastructure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          script: |
            const removedIds = ${{ needs.changed.outputs.removed_dataset_ids }};
            // removedIds[0] is a manifest *directory path* relative to
            // manifests/ (e.g. "usgs-3dep/boston-lot" for a grouped
            // dataset) -- but unlike dispatch-ingest/dispatch-preflight
            // above, there's no manifest.yaml left to read at this point
            // (the PR deleted it), so the infra side has nothing to
            // derive a real dataset id from the way
            // build-datasets-payload.mjs normally would. Take just the
            // leaf segment here instead -- the flat, globally-unique id
            // every R2 key/site route/STAC entry is actually keyed by.
            const datasetId = removedIds[0].split("/").pop();
            await github.rest.repos.createDispatchEvent({
              owner: "hobuinc",
              repo: "pointcloud.org-infrastructure",
              event_type: "manifest-removal",
              client_payload: {
                datasetId,
                sha: "${{ github.event.pull_request.merge_commit_sha }}",
                prNumber: ${{ github.event.pull_request.number }},
              },
            });

  # A PR whose manifest sets `dataset.federate: true` gets a
  # distinguishing label and a sticky comment explaining that merging it
  # will copy the dataset's source data into pointcloud.org's own
  # storage, not just reference it -- see schema.json's `federate`
  # description and worker/src/stages/federation.ts's doc comment for
  # what that actually does. Purely informational; the real copy only
  # happens post-merge, as part of real ingest (federation.ts runs
  # inside ingestRequest.ts, before any other stage).
  label-and-comment-federate:
    needs: [changed, check-federate]
    if: github.event.action != 'closed' && github.event.action != 'labeled' && needs.check-federate.outputs.federate == 'true' && needs.changed.outputs.too_many_datasets != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies (js-yaml)
        run: npm install
      # Best-effort HEAD-request size estimate of what federation.ts will
      # actually copy -- see federate-size.mjs's doc comment for exactly
      # what it measures and why (items[]'s foreign asset hrefs only;
      # ept_source is never federated, and a stac_item reference's real
      # asset hrefs aren't known without fetching that foreign document
      # too). "unknown" (not a number) if every URL's HEAD failed to
      # report a Content-Length -- surfaced as such in the comment below
      # rather than silently showing 0 GB.
      - name: Estimate federated dataset size
        id: size
        run: echo "bytes=$(node scripts/federate-size.mjs ${{ needs.changed.outputs.manifest_files }})" >> "$GITHUB_OUTPUT"
      - name: Label PR and post federate notice
        uses: actions/github-script@v7
        env:
          FEDERATE_SIZE_BYTES: ${{ steps.size.outputs.bytes }}
        with:
          script: |
            const datasetIds = ${{ needs.changed.outputs.dataset_ids }};
            const datasetId = datasetIds[0];

            const rawBytes = process.env.FEDERATE_SIZE_BYTES;
            const sizeLine =
              rawBytes === "unknown" || !rawBytes
                ? "unknown (one or more source URLs didn't report a size)"
                : `~${(Number(rawBytes) / 1024 ** 3).toFixed(2)} GB`;

            try {
              // Adding a label name that doesn't exist yet on this repo
              // auto-creates it (default color) -- no separate "ensure
              // label exists" step needed, same as label-and-comment-
              // removal's "removal" label above.
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ["federated"],
              });
            } catch (err) {
              core.warning(`could not add the "federated" label: ${err.message}`);
            }

            const marker = "<!-- pointcloud:federate-notice -->";
            const body = [
              marker,
              `### This PR requests \`federate: true\` for \`${datasetId}\``,
              "",
              `**This dataset's data will be copied into pointcloud.org's own storage, not just referenced.** Merging this PR copies **${datasetId}**'s asset data from wherever this manifest currently points into pointcloud.org's own bucket, at ingest time. Every later stage (metadata extraction, derivatives, the hero image) will then use that copy, and pointcloud.org's own record of this dataset's manifest will be rewritten to point at it.`,
              "",
              `**Estimated size to copy:** ${sizeLine}`,
              "",
              "This does not change the manifest committed in this repo -- only pointcloud.org's own internal record of where the data actually lives.",
            ].join("\n");

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body,
                });
              }
            } catch (err) {
              core.warning(`could not post the federate notice comment: ${err.message}`);
            }

  # Self-service re-ingest: applying the `reingest` label to an already-
  # merged PR (the PR that originally added/updated that dataset)
  # re-runs the whole ingest pipeline for it, without needing a human to
  # hand-author a no-op commit the way every earlier re-trigger in this
  # project's history required (see e.g. autzen's/barringer's manifest
  # comments -- "Re-trigger (2026-0X-XX): ..."). Mechanically identical
  # to what those manual re-triggers did: re-touch the dataset's
  # manifest.yaml (a comment-line append -- no real content change) on a
  # fresh branch, open a PR, and let the normal dispatch-ingest job
  # (which only cares that manifests/ changed and the PR merged, not
  # *what* changed) do the rest.
  #
  # Gated on `pull_request.merged == true` -- applying this label to a
  # still-open PR wouldn't make sense (just push more commits to that
  # same PR instead), and to a closed-but-unmerged one even less so
  # (nothing was ever ingested from it).
  #
  # Same fork-PR caveat as reject-multi-dataset-pr/label-and-comment-
  # removal above: a fork's default GITHUB_TOKEN is read-only by GitHub
  # platform policy, so the label-add/comment steps below can silently
  # fail to post for a fork contributor specifically -- labeling
  # generally requires triage/write access to this repo anyway, though,
  # so in practice this only ever fires for a maintainer.
  reingest:
    if: github.event.action == 'labeled' && github.event.label.name == 'reingest' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine which dataset the original PR touched
        id: dataset
        run: |
          FILE=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate \
            --jq '.[] | select(.filename | test("^manifests/.*/manifest\\.yaml$")) | select(.status != "removed") | .filename' \
            | head -n1)
          if [ -z "$FILE" ]; then
            echo "::error::could not find a manifests/**/manifest.yaml touched by PR #${{ github.event.pull_request.number }} -- nothing to reingest"
            exit 1
          fi
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE no longer exists on main (dataset removed since that PR) -- nothing to reingest"
            exit 1
          fi
          echo "manifest_path=$FILE" >> "$GITHUB_OUTPUT"
          echo "dataset_id=$(basename "$(dirname "$FILE")")" >> "$GITHUB_OUTPUT"
      - name: Re-touch manifest and open a reingest PR
        id: reingest
        run: |
          set -e
          FILE="${{ steps.dataset.outputs.manifest_path }}"
          DATASET_ID="${{ steps.dataset.outputs.dataset_id }}"
          BRANCH="reingest-${DATASET_ID}-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "pointcloud-org-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "# reingest requested via #${{ github.event.pull_request.number }} by @${{ github.event.sender.login }} on $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$FILE"
          git add "$FILE"
          git commit -m "Reingest ${DATASET_ID} (requested via #${{ github.event.pull_request.number }})"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --title "Reingest ${DATASET_ID}" \
            --body "Triggered by applying the \`reingest\` label to #${{ github.event.pull_request.number }} -- no content change, just a re-touch of \`${FILE}\` to re-run ingest for \`${DATASET_ID}\`." \
            --base main --head "$BRANCH")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          # Merge immediately rather than `gh pr merge --auto`: this repo
          # has no branch protection on main and no required status
          # checks (confirmed 2026-08-10 -- GET .../branches/main/protection
          # 404s), so there is nothing an --auto merge would actually be
          # waiting on. --auto instead depends on the repo's own "Allow
          # auto-merge" setting, which is off here -- that made `gh pr
          # merge --auto` a silent no-op, so applying the `reingest` label
          # opened a PR that just sat there until someone merged it by
          # hand, instead of actually firing a reingest. A direct
          # `gh pr merge --squash` has the same fallback (a merge conflict
          # or a future branch-protection rule would make this fail
          # loudly instead of silently) but actually completes the
          # reingest end-to-end when nothing is blocking it, which today
          # is always.
          # GitHub computes a PR's mergeable state asynchronously right
          # after creation, so a merge attempted immediately can
          # transiently fail with "Pull request is not mergeable" even
          # though nothing is actually blocking it -- retry briefly
          # before giving up and falling back to a warning.
          merged=false
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge --squash "$PR_URL"; then
              merged=true
              break
            fi
            sleep 5
          done
          if [ "$merged" != "true" ]; then
            echo "::warning::could not merge $PR_URL after retrying -- merge it manually to complete the reingest"
          fi
      - name: Comment on the original PR
        if: always() && steps.reingest.outputs.pr_url != ''
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "🔄 Reingest requested by @${{ github.event.sender.login }} via the \`reingest\` label -- opened ${{ steps.reingest.outputs.pr_url }} to re-run ingest for \`${{ steps.dataset.outputs.dataset_id }}\`."
      - name: Remove the reingest label so it can be reapplied later
        if: always()
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/reingest" || true
