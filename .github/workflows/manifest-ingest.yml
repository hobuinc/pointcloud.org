# Validates manifests/**/manifest.yaml on every PR that touches
# manifests/, then -- once such a PR is merged -- fires a
# repository_dispatch at the private
# hobuinc/pointcloud.org-infrastructure repo, which actually talks to
# the ingest Worker (see that repo's
# .github/workflows/receive-manifest-dispatch.yml).
#
# This repo is the public, community-facing half of the
# pointcloud.org / pointcloud.org-infrastructure split (2026-07-31):
# anyone can open a PR here adding or editing a dataset under
# manifests/<id>/ (manifest.yaml plus whatever companion files it
# references by relative path -- see README.md), but this repo holds no
# infrastructure secrets other than INFRA_DISPATCH_TOKEN, a
# fine-grained PAT scoped *only* to hobuinc/pointcloud.org-infrastructure
# with Contents: Read and write (the permission the dispatches endpoint
# checks) -- it cannot read or modify anything else there, and cannot
# touch Cloudflare, the Worker, or the site build directly.
#
# Two separate jobs, gated by `if:`, rather than two separate `on:`
# triggers -- both need to react to the same `pull_request` event
# (opened/updated vs. merged-and-closed), and GitHub Actions can't
# express "run this job only when merged" as a top-level `on:` filter.
name: Manifest ingest

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "manifests/**"

jobs:
  validate:
    # Runs on every open/update, not just the initial open -- catches a
    # fixup pushed after review comments, same as any other CI check.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (js-yaml, ajv, for the validator)
        run: npm install
      - name: Validate manifests
        run: node scripts/validate-manifests.mjs

  dispatch-ingest:
    # Only the merge path dispatches -- a PR that's closed without
    # merging (abandoned) should never kick off ingest.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (js-yaml, for build-datasets-payload.mjs)
        run: npm install

      - name: Determine which dataset directories this PR changed
        id: changed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // A dataset directory counts as "changed" if ANY file under
            // it changed -- not just manifest.yaml itself -- since
            // editing a referenced companion file (e.g. a
            // pdal_filters_file JSON) should re-trigger ingest for that
            // dataset too. Always re-reads manifest.yaml from the
            // dataset's directory below rather than trusting the
            // specific changed filename, so this works the same whether
            // manifest.yaml itself or just a companion file changed.
            //
            // Require at least 3 path segments (manifests/<dir>/<file>)
            // before treating segment 2 as a dataset directory name --
            // otherwise a top-level file directly under manifests/ (e.g.
            // manifests/schema.json, which has only 2 segments) gets
            // mistaken for a directory, producing an invalid path like
            // "manifests/schema.json/manifest.yaml" that crashes
            // build-datasets-payload.mjs with ENOTDIR. Learned from a
            // real failure: PR #5 touched schema.json alongside dataset
            // directories and broke exactly this way.
            const changedDirs = new Set(
              files
                .filter(
                  (f) =>
                    f.filename.startsWith("manifests/") &&
                    f.status !== "removed" &&
                    f.filename.split("/").length > 2,
                )
                .map((f) => f.filename.split("/").slice(0, 2).join("/")),
            );
            const manifestFiles = [...changedDirs].map((dir) => `${dir}/manifest.yaml`);
            core.setOutput("files", manifestFiles.join(" "));

      - name: Build datasets payload
        id: payload
        if: steps.changed.outputs.files != ''
        run: |
          echo "json<<PAYLOAD_EOF" >> "$GITHUB_OUTPUT"
          node scripts/build-datasets-payload.mjs ${{ steps.changed.outputs.files }} >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "PAYLOAD_EOF" >> "$GITHUB_OUTPUT"

      - name: Dispatch ingest to pointcloud.org-infrastructure
        if: steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        env:
          DATASETS_JSON: ${{ steps.payload.outputs.json }}
        with:
          github-token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          script: |
            const payload = JSON.parse(process.env.DATASETS_JSON);
            await github.rest.repos.createDispatchEvent({
              owner: "hobuinc",
              repo: "pointcloud.org-infrastructure",
              event_type: "manifest-ingest",
              client_payload: payload,
            });
