# Scheduled upstream-drift sweep, fanned out across parallel runners.
#
# pointcloud.org's archive is mostly *references to other people's data* --
# at time of writing 51 of 68 datasets point at third-party endpoints
# (mostly USGS-hosted EPT) that this project does not control. Those move:
# workunits get republished under new names, buckets get reorganized,
# endpoints get retired. This is the local equivalent of conda-forge's
# autotick bot, which exists for the same reason (see
# CONDA-FORGE-GAP-ANALYSIS.md in the infrastructure repo, Gap 2).
#
# ## Queue-and-runner shape
#
# Three jobs, fan-out then fan-in:
#
#   plan   reads every manifest once, builds the URL work list, and sizes
#          the matrix (one shard per ~URLS_PER_SHARD URLs, capped)
#   check  matrix of runners; each takes every Nth URL and writes only its
#          FAILURES to an artifact
#   report downloads every shard's artifact, aggregates, and maintains the
#          tracking issue
#
# A single-process sweep was O(every URL in the archive) in one runner,
# which at 1000s of datasets (and single datasets listing 10,000s of tiles)
# is minutes-to-hours of serial wall clock, with one network hiccup able to
# take the whole sweep down. Sharding makes wall clock a division problem
# and confines a failure to one shard. The work is sharded by URL rather
# than by dataset because dataset sizes here differ by three orders of
# magnitude -- per-dataset sharding just relocates the bottleneck to
# whichever runner draws the largest dataset.
#
# See scripts/reachability.mjs for why it samples rather than checking
# every tile of every dataset, and why only failures cross between jobs.
name: Upstream drift sweep

on:
  schedule:
    # 06:00 UTC Mondays. Weekly suits third-party republication: daily
    # mostly re-reports the same breakage, monthly lets a broken dataset
    # sit through an entire release cycle.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  # Per-dataset drift comments land on pull requests. The comment itself goes
  # through the PAT in GH_TOKEN below, but a PR comment is gated by
  # `pull-requests`, not `issues`, and stating it here keeps the workflow
  # working if it is ever switched to the default GITHUB_TOKEN.
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
      shards: ${{ steps.plan.outputs.shards }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Size the matrix
        id: plan
        run: |
          PLAN=$(node scripts/reachability.mjs plan)
          echo "$PLAN"
          echo "shard_ids=$(echo "$PLAN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s).shardIds)))')" >> "$GITHUB_OUTPUT"
          echo "shards=$(echo "$PLAN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).shards))')" >> "$GITHUB_OUTPUT"
          echo "summary=$PLAN" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One runner per shard. `fail-fast: false` is essential: a shard
      # whose slice happens to contain a broken URL must not cancel the
      # other shards, or the report would be built from partial data and
      # under-report breakage.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Check this shard
        run: |
          node scripts/reachability.mjs check \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.plan.outputs.shards }} \
            --out "reachability-shard-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: reachability-shard-${{ matrix.shard }}
          path: reachability-shard-${{ matrix.shard }}.json
          retention-days: 7

  report:
    needs: [plan, check]
    # `always()` so a shard that errored outright (rather than merely
    # finding a failure) still produces a report from whatever did
    # complete, instead of silently skipping the whole sweep.
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: reachability-shard-*
          path: shards
          merge-multiple: true
      - name: Aggregate the shards into one report
        id: report
        run: |
          set +e
          node scripts/reachability.mjs report --results shards \
            --json /tmp/drift.json > /tmp/report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat /tmp/report.md

      # The run page is where anyone who clicks the failing check lands, so put
      # the whole report there rather than making them open the tracking issue
      # to find out what broke. Every dataset, manifest and PR in it is a link.
      - name: Job summary
        if: always()
        run: |
          # Both files are guarded: this step is `always()`, and a report step
          # that died before writing them must not turn into a second, more
          # confusing failure on top of the first.
          {
            echo "## Upstream drift sweep"
            echo
            if [ -s /tmp/report.md ]; then
              cat /tmp/report.md
            else
              echo "⚠️ The report step produced nothing — see its log above."
            fi
            if [ -s /tmp/drift.json ]; then
              echo
              echo "<details><summary>Machine-readable report (drift.json)</summary>"
              echo
              echo '```json'
              head -c 30000 /tmp/drift.json
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded as well as summarised: the summary is for reading, this is for
      # anything that wants to diff one week's drift against the next.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: |
            /tmp/report.md
            /tmp/drift.json
          retention-days: 30

      # Report each broken dataset back to the pull request that last touched
      # it, tagging the manifest's github_owner. Never fails the job: the
      # tracking issue below is the authoritative record, and a courtesy ping
      # that could not be delivered is not a sweep failure.
      - name: Comment on each dataset's last active pull request
        if: steps.report.outputs.status != '0'
        continue-on-error: true
        run: node scripts/reachability.mjs notify --plan /tmp/drift.json

      - name: Open, update, or close the tracking issue
        run: |
          set -e
          LABEL=upstream-drift
          gh label create "$LABEL" --color "b60205" \
            --description "Upstream data drift detected by the weekly sweep" 2>/dev/null || true

          # `.[0] | "\(.number) \(.state)"` on an empty list renders the string
          # "null null" -- jq interpolates null happily -- so the first sweep
          # after this label is created read NUM="null" and died on
          # `gh issue edit null` with "invalid issue format". `// empty` makes
          # an absent issue an empty string, and the numeric guard below means
          # anything else unexpected degrades to "open a new issue" rather than
          # failing the run.
          EXISTING=$(gh issue list --label "$LABEL" --state all --limit 1 --json number,state \
            --jq '.[0] // empty | "\(.number) \(.state)"' 2>/dev/null || echo "")
          NUM=$(echo "$EXISTING" | awk '{print $1}')
          STATE=$(echo "$EXISTING" | awk '{print $2}')
          case "$NUM" in
            ''|*[!0-9]*) NUM="" ;;
          esac

          if [ "${{ steps.report.outputs.status }}" = "0" ]; then
            if [ -n "$NUM" ] && [ "$STATE" = "OPEN" ]; then
              gh issue comment "$NUM" --body-file /tmp/report.md
              gh issue close "$NUM"
              echo "closed #$NUM -- sweep is clean"
            else
              echo "clean sweep, no open tracking issue -- nothing to do"
            fi
            exit 0
          fi

          TITLE="Upstream data drift detected ($(date -u +%Y-%m-%d))"
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "$TITLE" --body-file /tmp/report.md
            if [ "$STATE" != "OPEN" ]; then
              gh issue reopen "$NUM"
            fi
            echo "updated tracking issue #$NUM"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file /tmp/report.md
            echo "opened a new tracking issue"
          fi
