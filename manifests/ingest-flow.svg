<svg viewBox="0 0 980 610" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Carlito, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">The nine steps a manifest takes, from pull request to published dataset</title>
  <desc id="flow-desc">Steps 1 through 5 repeat on every push while the pull request is open: you open a PR touching one dataset directory; this repo's own CI validates the manifest against schema.json, checks that relative references exist, that a github_owner is present, and that only one dataset is touched; once validation passes, GitHub delivers a signed webhook straight to pointcloud.org, which verifies its signature before acting; pointcloud.org's infrastructure runs the checks that need storage access (do the referenced files exist, do items_dir tiles share a CRS, do the PDAL filters parse); results come back as an updating PR comment plus one pointcloud/* commit status per check, and if anything is red you push a fixup commit and the loop repeats. Steps 6 through 9 fire once, when a maintainer merges: the merge is delivered as one signed webhook; queues fan every asset out so PDAL can read each one's real metadata in a container; once every asset lands, one assembly step writes the dataset's STAC Collection, ItemCollection and GeoParquet, queues a hero image, and posts a completion comment back on the merged PR; then the site is rebuilt and the archive-wide catalog and collections list update, with the merged archive parquet following on the next scheduled pass.</desc>

  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FA3B8"/>
    </marker>
    <marker id="tipGold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/>
    </marker>
    <marker id="tipLoop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="610" fill="#ffffff"/>

  <!-- Heading -->
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="700" font-family="Cambria, Caladea, Georgia, serif" fill="#13315C">From pull request to published dataset</text>
  <text x="490" y="50" text-anchor="middle" font-size="11.5" fill="#5A6B7B">Nine steps. You do the first one; a maintainer does the sixth. Everything else runs itself.</text>

  <!-- ============ PHASE A ============ -->
  <rect x="10" y="66" width="960" height="24" rx="6" fill="#F1F5F9"/>
  <text x="24" y="83" font-size="11" font-weight="700" fill="#13315C" letter-spacing="0.6">WHILE THE PULL REQUEST IS OPEN</text>
  <text x="290" y="83" font-size="10.5" fill="#5A6B7B">every step below re-runs on every push — nothing is enqueued, nobody is emailed</text>

  <!-- Step 1 -->
  <rect x="10" y="102" width="176" height="158" rx="10" fill="#ffffff" stroke="#CBD8E6" stroke-width="1.25"/>
  <circle cx="34" cy="126" r="13" fill="#E8A33D"/>
  <text x="34" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">1</text>
  <rect x="104" y="115" width="70" height="17" rx="8.5" fill="#0B2545"/>
  <text x="139" y="127" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">YOU</text>
  <text x="24" y="164" font-size="12.5" font-weight="700" fill="#13315C">Open a pull request</text>
  <text x="24" y="186" font-size="10.5" fill="#5A6B7B">Add or edit exactly one</text>
  <text x="24" y="200" font-size="10.5" fill="#5A6B7B">directory under manifests/,</text>
  <text x="24" y="214" font-size="10.5" fill="#5A6B7B">holding one manifest.yaml</text>
  <text x="24" y="228" font-size="10.5" fill="#5A6B7B">plus any companion files it</text>
  <text x="24" y="242" font-size="10.5" fill="#5A6B7B">references.</text>

  <!-- Step 2 -->
  <rect x="206" y="102" width="176" height="158" rx="10" fill="#ffffff" stroke="#CBD8E6" stroke-width="1.25"/>
  <circle cx="230" cy="126" r="13" fill="#E8A33D"/>
  <text x="230" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">2</text>
  <rect x="284" y="115" width="86" height="17" rx="8.5" fill="#1C7293"/>
  <text x="327" y="127" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">CI, IN THIS REPO</text>
  <text x="220" y="164" font-size="12.5" font-weight="700" fill="#13315C">Checks that need no</text>
  <text x="220" y="180" font-size="12.5" font-weight="700" fill="#13315C">credentials</text>
  <text x="220" y="200" font-size="10.5" fill="#5A6B7B">schema.json shape · relative</text>
  <text x="220" y="214" font-size="10.5" fill="#5A6B7B">references exist · a</text>
  <text x="220" y="228" font-size="10.5" fill="#5A6B7B">github_owner is named ·</text>
  <text x="220" y="242" font-size="10.5" fill="#5A6B7B">remote URLs are reachable</text>

  <!-- Step 3 -->
  <rect x="402" y="102" width="176" height="158" rx="10" fill="#ffffff" stroke="#CBD8E6" stroke-width="1.25"/>
  <circle cx="426" cy="126" r="13" fill="#E8A33D"/>
  <text x="426" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">3</text>
  <rect x="470" y="115" width="96" height="17" rx="8.5" fill="#13315C"/>
  <text x="518" y="127" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">SIGNED WEBHOOK</text>
  <text x="416" y="164" font-size="12.5" font-weight="700" fill="#13315C">Signed webhook</text>
  <text x="416" y="186" font-size="10.5" fill="#5A6B7B">GitHub delivers the event</text>
  <text x="416" y="200" font-size="10.5" fill="#5A6B7B">straight to pointcloud.org,</text>
  <text x="416" y="214" font-size="10.5" fill="#5A6B7B">which verifies its signature</text>
  <text x="416" y="228" font-size="10.5" fill="#5A6B7B">before trusting a byte of it.</text>
  <text x="416" y="242" font-size="10.5" fill="#5A6B7B">No relay repo in between.</text>

  <!-- Step 4 -->
  <rect x="598" y="102" width="176" height="158" rx="10" fill="#FFFBF3" stroke="#E8A33D" stroke-width="1.5"/>
  <circle cx="622" cy="126" r="13" fill="#E8A33D"/>
  <text x="622" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">4</text>
  <rect x="668" y="115" width="94" height="17" rx="8.5" fill="#0B2545"/>
  <text x="715" y="127" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">INFRASTRUCTURE</text>
  <text x="612" y="164" font-size="12.5" font-weight="700" fill="#13315C">The checks that need</text>
  <text x="612" y="180" font-size="12.5" font-weight="700" fill="#13315C">storage access</text>
  <text x="612" y="200" font-size="10.5" fill="#5A6B7B">Do the referenced files really</text>
  <text x="612" y="214" font-size="10.5" fill="#5A6B7B">exist? Do items_dir tiles all</text>
  <text x="612" y="228" font-size="10.5" fill="#5A6B7B">share one CRS? Do the PDAL</text>
  <text x="612" y="242" font-size="10.5" fill="#5A6B7B">filters actually parse?</text>

  <!-- Step 5 -->
  <rect x="794" y="102" width="176" height="158" rx="10" fill="#ffffff" stroke="#CBD8E6" stroke-width="1.25"/>
  <circle cx="818" cy="126" r="13" fill="#E8A33D"/>
  <text x="818" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">5</text>
  <rect x="864" y="115" width="94" height="17" rx="8.5" fill="#0B2545"/>
  <text x="911" y="127" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">INFRASTRUCTURE</text>
  <text x="808" y="164" font-size="12.5" font-weight="700" fill="#13315C">Answers land on your</text>
  <text x="808" y="180" font-size="12.5" font-weight="700" fill="#13315C">pull request</text>
  <text x="808" y="200" font-size="10.5" fill="#5A6B7B">One comment that updates in</text>
  <text x="808" y="214" font-size="10.5" fill="#5A6B7B">place, plus a pointcloud/*</text>
  <text x="808" y="228" font-size="10.5" fill="#5A6B7B">commit status per check, so</text>
  <text x="808" y="242" font-size="10.5" fill="#5A6B7B">you can see which one failed.</text>

  <!-- Arrows across phase A -->
  <path d="M188,181 L202,181" fill="none" stroke="#8FA3B8" stroke-width="1.5" marker-end="url(#tip)"/>
  <path d="M384,181 L398,181" fill="none" stroke="#8FA3B8" stroke-width="1.5" marker-end="url(#tip)"/>
  <path d="M580,181 L594,181" fill="none" stroke="#E8A33D" stroke-width="1.5" marker-end="url(#tipGold)"/>
  <path d="M776,181 L790,181" fill="none" stroke="#E8A33D" stroke-width="1.5" marker-end="url(#tipGold)"/>

  <!-- Loop back: red? push a fixup commit -->
  <path d="M882,262 L882,286 L98,286 L98,264" fill="none" stroke="#5A6B7B" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#tipLoop)"/>
  <rect x="386" y="276" width="208" height="20" rx="10" fill="#ffffff"/>
  <text x="490" y="290" text-anchor="middle" font-size="10.5" fill="#5A6B7B" font-style="italic">anything red? push a fixup commit</text>

  <!-- ============ PHASE B ============ -->
  <rect x="10" y="312" width="960" height="24" rx="6" fill="#E7EEF5"/>
  <text x="24" y="329" font-size="11" font-weight="700" fill="#13315C" letter-spacing="0.6">ONCE A MAINTAINER MERGES IT</text>
  <text x="290" y="329" font-size="10.5" fill="#5A6B7B">fires exactly once — no human touches anything from here to publication</text>

  <!-- Step 6 -->
  <rect x="10" y="348" width="228" height="168" rx="10" fill="#ffffff" stroke="#CBD8E6" stroke-width="1.25"/>
  <circle cx="34" cy="372" r="13" fill="#E8A33D"/>
  <text x="34" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">6</text>
  <rect x="146" y="361" width="80" height="17" rx="8.5" fill="#0B2545"/>
  <text x="186" y="373" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">MAINTAINER</text>
  <text x="24" y="410" font-size="12.5" font-weight="700" fill="#13315C">Merge</text>
  <text x="24" y="432" font-size="10.5" fill="#5A6B7B">The merge itself is the trigger: one</text>
  <text x="24" y="446" font-size="10.5" fill="#5A6B7B">signed delivery starts it. Preflight</text>
  <text x="24" y="460" font-size="10.5" fill="#5A6B7B">already told everyone what will</text>
  <text x="24" y="474" font-size="10.5" fill="#5A6B7B">happen, so this is the first step with</text>
  <text x="24" y="488" font-size="10.5" fill="#5A6B7B">side effects — and the only one that</text>
  <text x="24" y="502" font-size="10.5" fill="#5A6B7B">needs a decision.</text>

  <!-- Step 7 -->
  <rect x="254" y="348" width="228" height="168" rx="10" fill="#FFFBF3" stroke="#E8A33D" stroke-width="1.5"/>
  <circle cx="278" cy="372" r="13" fill="#E8A33D"/>
  <text x="278" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">7</text>
  <rect x="376" y="361" width="94" height="17" rx="8.5" fill="#0B2545"/>
  <text x="423" y="373" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">INFRASTRUCTURE</text>
  <text x="268" y="410" font-size="12.5" font-weight="700" fill="#13315C">Read every asset</text>
  <text x="268" y="432" font-size="10.5" fill="#5A6B7B">Queues fan the dataset's assets out</text>
  <text x="268" y="446" font-size="10.5" fill="#5A6B7B">so each is processed independently</text>
  <text x="268" y="460" font-size="10.5" fill="#5A6B7B">and retried on its own. PDAL runs in</text>
  <text x="268" y="474" font-size="10.5" fill="#5A6B7B">a container to read each file's real</text>
  <text x="268" y="488" font-size="10.5" fill="#5A6B7B">metadata: point count, bounds,</text>
  <text x="268" y="502" font-size="10.5" fill="#5A6B7B">coordinate system, statistics.</text>

  <!-- Step 8 -->
  <rect x="498" y="348" width="228" height="168" rx="10" fill="#FFFBF3" stroke="#E8A33D" stroke-width="1.5"/>
  <circle cx="522" cy="372" r="13" fill="#E8A33D"/>
  <text x="522" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">8</text>
  <rect x="620" y="361" width="94" height="17" rx="8.5" fill="#0B2545"/>
  <text x="667" y="373" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">INFRASTRUCTURE</text>
  <text x="512" y="410" font-size="12.5" font-weight="700" fill="#13315C">Assemble the record</text>
  <text x="512" y="432" font-size="10.5" fill="#5A6B7B">When the last asset lands, one</text>
  <text x="512" y="446" font-size="10.5" fill="#5A6B7B">assembly step writes the dataset's</text>
  <text x="512" y="460" font-size="10.5" fill="#5A6B7B">STAC Collection, ItemCollection and</text>
  <text x="512" y="474" font-size="10.5" fill="#5A6B7B">GeoParquet, queues a hero image</text>
  <text x="512" y="488" font-size="10.5" fill="#5A6B7B">from the real viewer, and comments</text>
  <text x="512" y="502" font-size="10.5" fill="#5A6B7B">the result on your PR.</text>

  <!-- Step 9 -->
  <rect x="742" y="348" width="228" height="168" rx="10" fill="#ffffff" stroke="#CBD8E6" stroke-width="1.25"/>
  <circle cx="766" cy="372" r="13" fill="#E8A33D"/>
  <text x="766" y="377" text-anchor="middle" font-size="14" font-weight="700" fill="#13315C">9</text>
  <rect x="864" y="361" width="94" height="17" rx="8.5" fill="#0B2545"/>
  <text x="911" y="373" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff" letter-spacing="0.3">INFRASTRUCTURE</text>
  <text x="756" y="410" font-size="12.5" font-weight="700" fill="#13315C">Publish</text>
  <text x="756" y="432" font-size="10.5" fill="#5A6B7B">The site is rebuilt so the dataset</text>
  <text x="756" y="446" font-size="10.5" fill="#5A6B7B">page goes live, and the archive-wide</text>
  <text x="756" y="460" font-size="10.5" fill="#5A6B7B">catalog and collections list update.</text>
  <text x="756" y="474" font-size="10.5" fill="#5A6B7B">The merged archive parquet is</text>
  <text x="756" y="488" font-size="10.5" fill="#5A6B7B">rebuilt on a six-hourly pass, so it</text>
  <text x="756" y="502" font-size="10.5" fill="#5A6B7B">can trail the page by a while.</text>

  <!-- Arrows across phase B -->
  <path d="M240,432 L250,432" fill="none" stroke="#E8A33D" stroke-width="1.5" marker-end="url(#tipGold)"/>
  <path d="M484,432 L494,432" fill="none" stroke="#E8A33D" stroke-width="1.5" marker-end="url(#tipGold)"/>
  <path d="M728,432 L738,432" fill="none" stroke="#E8A33D" stroke-width="1.5" marker-end="url(#tipGold)"/>

  <!-- Footer notes -->
  <line x1="10" y1="540" x2="970" y2="540" stroke="#E7EEF5" stroke-width="1"/>
  <text x="10" y="560" font-size="10.5" fill="#5A6B7B"><tspan font-weight="700" fill="#13315C">This repo holds no credentials at all.</tspan> Step 2 needs none; step 3 is GitHub signing a delivery that pointcloud.org verifies for itself, so no runner ever holds a secret.</text>
  <text x="10" y="578" font-size="10.5" fill="#5A6B7B"><tspan font-weight="700" fill="#13315C">Deleting a manifest directory</tspan> runs the same shape in reverse: the PR is labelled <tspan font-family="Consolas, 'DejaVu Sans Mono', monospace">removal</tspan>, and merging it de-indexes the dataset. The data itself stays in storage.</text>
  <text x="10" y="596" font-size="10.5" fill="#5A6B7B"><tspan font-weight="700" fill="#13315C">Nothing here is a one-way door.</tspan> Re-running the whole path for a dataset that is already live takes one label or one comment — see “Asking for work” in README.md.</text>
</svg>
