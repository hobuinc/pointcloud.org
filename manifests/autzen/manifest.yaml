schema_version: 2

type: Collection
stac_version: "1.0.0"
id: autzen
title: Autzen Stadium
description: >
  A well-known PDAL/point-cloud community sample dataset: an airborne
  lidar survey of Autzen Stadium and the surrounding University of
  Oregon campus area in Eugene, Oregon, collected by Watershed
  Sciences, Inc. in 2010. In 2021, Max Sampson of Hobu, Inc. manually
  classified 21 object categories on the original point cloud -- this
  is that classified version, hosted directly by pointcloud.org. See
  https://github.com/PDAL/data/tree/main/autzen for the source
  repository this dataset is drawn from, including the original,
  unclassified point cloud and full acquisition details.
license: CC-BY-4.0
keywords: [oregon, sample-data, pdal, university-of-oregon]
providers:
  - name: Watershed Sciences, Inc.
    roles: [producer]
  - name: Hobu, Inc.
    roles: [processor]
    url: https://hobu.co
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
  - name: PDAL
    roles: [host]
    url: https://github.com/PDAL/data
links:
  - rel: about
    href: https://github.com/PDAL/data/tree/main/autzen
  - rel: license
    href: https://github.com/PDAL/data/blob/main/LICENSE

pointcloud_org:
  derivatives: true
  viewer:
    enabled: true
    default_asset_id: autzen-classified

# pointcloud.org already hosts its own copy of this classified survey
# (see the description above) -- PDAL/data does publish a fully-formed
# STAC Item for the same file (stac/autzen_copc.json), but its `data`
# asset resolves to GitHub's media.githubusercontent.com LFS host
# rather than this bucket. Since we're the ones already hosting it,
# describing it directly with a plain `items` entry is the right form
# here, not `stac_item` (that form exists for datasets we *don't* host
# ourselves, see autzen-2023's `federate: true` for the "we want our
# own copy but the contributor's is the source of truth" case).
# Re-trigger (2026-08-06): re-ingest to pick up assets.data.type
# (COPC media type) on this Item -- this dataset was first ingested
# before mediaTypeForHref() shipped in the ingest Worker, so its stored
# STAC Item never got the field written at all (confirmed missing from
# a live /stac/search response; not a caching issue).
# Re-trigger (2026-08-09): pick up density-targeted --readers.copc.resolution
# + real filters.hexbin boundary geometry instead of a bbox rectangle.
# Re-trigger (2026-08-09, again): verifying the richer ingest-
# completion PR comment reports real HEAD-derived byte size for a
# hosted (non-EPT) COPC asset.
items:
- id: autzen-classified
  assets:
    data:
      href: s3://pointcloud/autzen/autzen-classified.copc.laz
      roles: [data]
  pointcloud_org:
    copc_resolution: 1
