schema_version: 1

# Two epochs: 2011 and 2020. Provider not confirmed.
# TODO: confirm license before publishing -- not yet verified for this dataset.
dataset:
  id: mount-st-helens
  title: Mount St. Helens
  summary: "TODO: write a one-line summary for Mount St. Helens"
  license: UNKNOWN
  derivatives: true
  # Every asset below lives in our own Cloudflare R2 bucket, but this
  # is declared explicitly (rather than inferred from the "pointcloud"
  # bucket name) so every dataset uniformly states which S3-compatible
  # service+account hosts it -- AWS S3, this Cloudflare R2 account, or
  # someone else's bucket. Purely informational for this bucket: the
  # Worker always fetches "s3://pointcloud/..." via its native R2
  # binding, never over HTTP, so this value has no effect on fetching.
  default_endpoint: https://c88d624d8d8f065b1afce73bd44dcf1d.r2.cloudflarestorage.com
  providers:
    - organization:
        name: "TODO: confirm organization name"
      contact:
        name: Howard Butler
        email: howard@hobu.co
  tags: [washington, volcano]
  temporal:
    start: 2011-01-01
    end: 2020-12-31
  viewer:
    enabled: true
    default_asset_id: st-helens-2011

assets:
  - id: st-helens-2011
    href: s3://pointcloud/st-helens/st-helens-2011.copc.laz
    roles: [data]
    copc:
      resolution: 1  # TODO: confirm intended resolution

  - id: st-helens-2020
    href: s3://pointcloud/st-helens/st-helens-2020.copc.laz
    roles: [data]
    copc:
      resolution: 1  # TODO: confirm intended resolution
