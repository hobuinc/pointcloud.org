schema_version: 2

# USGS 3DEP acquisition, part of a five-state EPT batch ingest (ND, PA, NY,
# ME, MS). Selected because this workunit has both USGS EPT hosting and a
# WESM.csv row -- the dates, quality level, spec and CRS below all come from
# WESM, the point count from the workunit's own ept.json, and the producer
# from the vendor FGDC metadata. Workunits with EPT but no WESM row were
# deferred rather than published without acquisition dates.
type: Collection
stac_version: "1.0.0"
id: MS_MississippiDelta_4_2018
title: Mississippi 3DEP Lidar — MississippiDelta 4 2018
description: >
  Classified airborne lidar point cloud collected 2019-06-29 through
  2020-12-13 by NV5 Geospatial for the USGS 3D Elevation Program (3DEP) as
  part of the "MS_Central_Delta_2018_D18" project (project ID 78034),
  acquired to QL 2 meeting the USGS Lidar Base Specification 1.2.
  Approximately 64,063,745,207 points. Served here directly from USGS's
  public Entwine Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage, so this Collection's single item streams
  live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [mississippi, usgs, 3dep, lidar, entwine, ept, nv5-geospatial]
providers:
  - name: NV5 Geospatial
    roles: [producer]
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2019-06-29", "2020-12-13"]

"sci:citation": >
  NV5 Geospatial (2019). MS_Central_Delta_2018_D18; Project ID: 78034;
  Classified Point Cloud. U.S. Geological Survey 3D Elevation Program.

