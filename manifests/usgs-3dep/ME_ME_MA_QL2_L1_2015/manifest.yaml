schema_version: 2

# USGS 3DEP acquisition, part of a five-state EPT batch ingest (ND, PA, NY,
# ME, MS). Selected because this workunit has both USGS EPT hosting and a
# WESM.csv row -- the dates, quality level, spec and CRS below all come from
# WESM, the point count from the workunit's own ept.json, and the producer
# from the vendor FGDC metadata. Workunits with EPT but no WESM row were
# deferred rather than published without acquisition dates.
type: Collection
stac_version: "1.0.0"
id: ME_ME_MA_QL2_L1_2015
title: Maine 3DEP Lidar — ME MA QL2 L1 2015
description: >
  Classified airborne lidar point cloud collected 2015-04-19 through
  2015-12-05 by Quantum Spatial for the USGS 3D Elevation Program (3DEP) as
  part of the "Maine_and_Massachusetts_QL1_and_QL2_LiDAR_BAA" project
  (project ID 30172), acquired to QL 2 meeting the USGS Lidar Base
  Specification 1.2. Approximately 29,699,353,531 points. Served here
  directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage, so this
  Collection's single item streams live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [maine, usgs, 3dep, lidar, entwine, ept, quantum-spatial]
providers:
  - name: Quantum Spatial
    roles: [producer]
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2015-04-19", "2015-12-05"]

"sci:citation": >
  Quantum Spatial (2015). Maine_and_Massachusetts_QL1_and_QL2_LiDAR_BAA;
  Project ID: 30172; Classified Point Cloud. U.S. Geological Survey 3D
  Elevation Program.

