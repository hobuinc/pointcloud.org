schema_version: 2

# USGS 3DEP acquisition, Dewberry 2019-2020, part of a 12-dataset Iowa
# batch ingest (all IA_* workunits except IA_FullState). Metadata
# cross-checked 2026-08-09 against the FGDC XML at the href in
# metadata_links below, USGS's WESM.csv, and the EPT resource's own
# ept.json. Ingested via `ept_source` -- see manifests/README.md.
type: Collection
stac_version: "1.0.0"
id: IA_Eastern_1_2019
title: IA Eastern 1 2019 Lidar
description: >
  Classified airborne lidar point cloud covering approximately 6,207 square
  miles of the Eastern Iowa Lidar project area (part of a 14,724 square-
  mile, three-workunit project), collected December 2019 through June 2020
  by Dewberry for the USGS 3D Elevation Program (3DEP) as part of the "IA
  EasternIA 2019 B19" project. Acquired at QL2 spec (nominal pulse spacing
  0.7m) meeting the USGS National Geospatial Program Base Lidar
  Specification, Version 1.3. Served here directly from USGS's public
  Entwine Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [iowa, usgs, 3dep, lidar, eastern-iowa, entwine, ept, dewberry]
