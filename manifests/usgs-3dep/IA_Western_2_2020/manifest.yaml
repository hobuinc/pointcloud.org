schema_version: 2

# USGS 3DEP acquisition, Aerial Services, Inc. 2020-2021, part of a
# 12-dataset Iowa batch ingest (all IA_* workunits except
# IA_FullState). Metadata cross-checked 2026-08-09 against the FGDC
# XML at the href in metadata_links below, USGS's WESM.csv, and the
# EPT resource's own ept.json. Ingested via `ept_source` -- see
# manifests/README.md.
type: Collection
stac_version: "1.0.0"
id: IA_Western_2_2020
title: IA Western 2 2020 Lidar
description: >
  Classified airborne lidar point cloud covering approximately 4,813 square
  miles of western Iowa -- O'Brien, Cherokee, Ida, Crawford, Shelby, and
  Audubon Counties, plus the eastern sections of Lyon, Sioux, Plymouth,
  Woodbury, Monona, and Harrison Counties -- collected November 2020 through
  April 2021 by Aerial Services, Inc. for the USGS 3D Elevation Program
  (3DEP) as part of the "IA WesternIA 2020 D21" project. Acquired at QL2
  spec (nominal pulse spacing 0.71m) meeting the USGS National Geospatial
  Program Base Lidar Specification, Version 2020 Revision A. Served here
  directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
