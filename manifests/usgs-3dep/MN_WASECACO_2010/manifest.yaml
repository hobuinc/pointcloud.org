type: Collection
stac_version: "1.0.0"
id: MN_WASECACO_2010
title: MN Waseca County 2010 Lidar
description: >
  Classified airborne lidar point cloud covering Waseca County, Minnesota,
  collected 2010-04-08 through 2011-11-19 by AeroMetric, Inc. for the
  Minnesota Department of Natural Resources (MnDNR) as part of the "MN Waseca
  County 2010" project, acquired at a nominal post spacing of 1.3m (Optech
  Gemini sensor, per the project-wide FGDC metadata) meeting the Minnesota
  River Basin LiDAR Acquisition project specification. Served here directly
  from USGS's public Entwine Point Tile (EPT) bucket via `ept_source` -- not
  copied into pointcloud.org's own storage, so this Collection's single item
  streams live from USGS's own infrastructure.
license:
