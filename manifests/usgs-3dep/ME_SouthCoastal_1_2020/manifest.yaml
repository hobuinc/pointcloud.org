schema_version: 2

# USGS 3DEP acquisition, part of a five-state EPT batch ingest (ND, PA, NY,
# ME, MS). Selected because this workunit has both USGS EPT hosting and a
# WESM.csv row -- the dates, quality level, spec and CRS below all come from
# WESM, the point count from the workunit's own ept.json, and the producer
# from the vendor FGDC metadata. Workunits with EPT but no WESM row were
# deferred rather than published without acquisition dates.
type: Collection
stac_version: "1.0.0"
id: ME_SouthCoastal_1_2020
title: Maine 3DEP Lidar — SouthCoastal 1 2020
description: >
  Classified airborne lidar point cloud collected 2020-05-17 through
  2020-06-10 by NV5 Geospatial, powered by Quantum Spatial for the USGS 3D
  Elevation Program (3DEP) as part of the "ME_SouthCoastal_2020_A20" project
  (project ID 191384), acquired to QL 2 meeting the USGS Lidar Base
  Specification 2.1. Approximately 47,351,251,607 points. Served here
  directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage, so this
  Collection's single item streams live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [maine, usgs, 3dep, lidar, entwine, ept, nv5-geospatial-powered-by-quantum-spatia]
providers:
  - name: NV5 Geospatial, powered by Quantum Spatial
    roles: [producer]
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2020-05-17", "2020-06-10"]

"sci:citation": >
  NV5 Geospatial, powered by Quantum Spatial (2020).
  ME_SouthCoastal_2020_A20; Project ID: 191384; Classified Point Cloud. U.S.
  Geological Survey 3D Elevation Program.

