type: Collection
stac_version: "1.0.0"
id: IA_SouthCentral_1_2020
title: IA South Central 1 2020 Lidar
description: >
  Classified airborne lidar point cloud covering the D1 delivery of the
  South Central Iowa lidar project (D20), part of a roughly 10,238 square-
  mile project area, collected April 2020 by Digital Aerial Solutions, LLC
  for the USGS 3D Elevation Program (3DEP) in cooperation with the USDA
  Natural Resources Conservation Service (NRCS) and the Iowa Department of
  Agriculture and Land Stewardship (IDALS), as part of the "IA SouthCentral
  2020 D20" project. Acquired at QL2 spec meeting the USGS National
  Geospatial Program Base Lidar Specification, Version 2.1. Served here
  directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage.
