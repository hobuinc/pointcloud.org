schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). Contract/task-order confirmed via sibling
# MN_CentralMissRiver_1_B22's FGDC XML, applied across this project's other
# workunits on that basis.
type: Collection
stac_version: "1.0.0"
id: MN_CentralMissRiver_4_B22
title: MN Central Mississippi River 4 2022 Lidar
description: >
  Classified airborne lidar point cloud collected 2022-05-04 through
  2022-05-24 by Woolpert for the USGS 3D Elevation Program (3DEP) as part of
  the "MN Central Mississippi River 4 2022" project, acquired at QL 1 spec
  meeting the USGS National Geospatial Program Base Lidar Specification (USGS
  Lidar Base Specification 2021 Revision A). Served here directly from USGS's
  public Entwine Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage, so this Collection's single item streams live
  from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, central-mississippi-river, woolpert]
providers:
  - name: Woolpert
    roles: [producer]
    url: https://woolpert.com/
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
extent:
  temporal:
    interval:
      - ["2022-05-04", "2022-05-24"]

"sci:citation": >
  Woolpert (2022). MN Central Mississippi River 4 2022 Lidar; Project ID:
  230951 - WU300158; Classified Point Cloud. U.S. Geological Survey 3D
  Elevation Program. USGS Contract No. 140G0221D0013, Task Order No.
  140G0222F0098.

pointcloud_org:
  derivatives: false
  spatial_reference:
    id: "EPSG:6344"
    vertical_id: "EPSG:5703"
    url: https://epsg.io/6344
  acknowledgement: >
    Acknowledgement of the U.S. Geological Survey would be appreciated for
    products derived from these data.
  viewer:
    enabled: true
    default_asset_id: MN_CentralMissRiver_4_B22

ept_source:
