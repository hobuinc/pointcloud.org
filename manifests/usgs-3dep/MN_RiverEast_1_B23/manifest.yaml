schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). CompassData provided ground-control support as a
# subcontractor.
type: Collection
stac_version: "1.0.0"
id: MN_RiverEast_1_B23
title: MN River East 1 2023 Lidar
description: >
  Classified airborne lidar point cloud collected 2023-04-11 through
  2023-05-10 by NV5 Geospatial for the USGS 3D Elevation Program (3DEP) as
  part of the "MN River East 1 2023" project, acquired at QL 1 spec meeting
  the USGS National Geospatial Program Base Lidar Specification (USGS Lidar
  Base Specification 2023 Revision A). Served here directly from USGS's public
  Entwine Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage, so this Collection's single item streams live
  from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, river-east, nv5-geospatial]
providers:
  - name: NV5 Geospatial
    roles: [producer]
    url: https://www.nv5geospatial.com/
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2023-04-11", "2023-05-10"]

"sci:citation": >
  NV5 Geospatial (2023). MN River East 1 2023 Lidar; Project ID: 300078 -
  WU300470; Classified Point Cloud. U.S. Geological Survey 3D Elevation
  Program. USGS Contract No. 140G0221D0012, Task Order No. 140G0223F0148.

