    href: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/metadata/MN_SE_Driftless_2021_B21/MN_SEDriftless_1_2021/reports/USGS_MN_SEDriftless_1_2021_Summary_Report.pdf
extent:
  temporal:
    interval:
      - ["2021-04-22", "2021-06-13"]

"sci:citation": >
  Woolpert (2022). MN SE Driftless 1 2021; Project ID: 222538 - WU228969;
  Classified Point Cloud. U.S. Geological Survey 3D Elevation Program. USGS
