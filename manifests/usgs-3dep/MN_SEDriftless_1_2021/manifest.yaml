schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). Sibling of MN_SEDriftless_3_2021 (already ingested);
# contract/task-order confirmed identical between WU228969 and WU228972,
# applied here to WU228969 on that basis.
type: Collection
stac_version: "1.0.0"
id: MN_SEDriftless_1_2021
title: MN SE Driftless 1 2021 Lidar
description: >
  Classified airborne lidar point cloud covering the southeast Minnesota
  driftless area, collected 2021-04-22 through 2021-06-13 by Woolpert for the
  USGS 3D Elevation Program (3DEP) as part of the "MN SE Driftless 1 2021"
  project, acquired at QL 1 spec meeting the USGS National Geospatial Program
  Base Lidar Specification (USGS Lidar Base Specification 2021 Revision A).
  Served here directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage, so this
  Collection's single item streams live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, driftless-area, woolpert]
providers:
  - name: Woolpert
    roles: [producer]
    url: https://woolpert.com/
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
links:
