schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). Publisher of record is Short Elliott Hendrickson, Inc.
# (SEH); Quantum Spatial, Inc. was the acquisition contractor.
type: Collection
stac_version: "1.0.0"
id: MN_LakeCounty_2018
title: MN Lake County 2018 Lidar
description: >
  Classified airborne lidar point cloud collected 2018-09-22 through
  2018-10-22 by Quantum Spatial, Inc. for the USGS 3D Elevation Program (3DEP)
  as part of the "MN Lake County 2018" project, acquired at QL 1 spec meeting
  the USGS National Geospatial Program Base Lidar Specification (Other).
  Served here directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage, so this
  Collection's single item streams live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, lake-county, quantum-spatial]
providers:
  - name: Quantum Spatial, Inc.
    roles: [producer]
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2018-09-22", "2018-10-22"]

"sci:citation": >
  Quantum Spatial, Inc. (2018). MN Lake County 2018 Lidar; Project ID: 187246
  - WU187243; Classified Point Cloud. U.S. Geological Survey 3D Elevation
  Program. USGS Contract No. I6AAP-17.

pointcloud_org:
  derivatives: false
  spatial_reference:
    id: "EPSG:6344"
    vertical_id: "EPSG:5703"
    url: https://epsg.io/6344
  acknowledgement: >
    Acknowledgement of the U.S. Geological Survey would be appreciated for
    products derived from these data.
  viewer:
    enabled: true
    default_asset_id: MN_LakeCounty_2018

ept_source:
  href: https://s3-us-west-2.amazonaws.com/usgs-lidar-public/MN_LakeCounty_2018/ept.json
  ept_catalog_id: MN_LakeCounty_2018
  pointcloud_org:
    copc_resolution: 1
