schema_version: 2

# USGS 3DEP acquisition, part of a five-state EPT batch ingest (ND, PA, NY,
# ME, MS). Selected because this workunit has both USGS EPT hosting and a
# WESM.csv row -- the dates, quality level, spec and CRS below all come from
# WESM, the point count from the workunit's own ept.json, and the producer
# from the vendor FGDC metadata. Workunits with EPT but no WESM row were
# deferred rather than published without acquisition dates.
type: Collection
stac_version: "1.0.0"
id: NY_HudsonRiverRegion_1_2020
title: New York 3DEP Lidar — HudsonRiverRegion 1 2020
description: >
  Classified airborne lidar point cloud collected 2018-08-11 through
  2019-10-14 by L3Harris for the USGS 3D Elevation Program (3DEP) as part of
  the "NY_HudsonRiverRegion_2020_A20" project (project ID 192494), acquired
  to QL 2 meeting the USGS Lidar Base Specification 2.1. Approximately
  352,549,521,029 points. Served here directly from USGS's public Entwine
  Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage, so this Collection's single item streams
  live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [new-york, usgs, 3dep, lidar, entwine, ept, l3harris]
providers:
  - name: L3Harris
    roles: [producer]
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2018-08-11", "2019-10-14"]

"sci:citation": >
  L3Harris (2018). NY_HudsonRiverRegion_2020_A20; Project ID: 192494;
  Classified Point Cloud. U.S. Geological Survey 3D Elevation Program.

links:
