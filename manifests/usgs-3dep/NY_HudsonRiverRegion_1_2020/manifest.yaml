    href: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/metadata/NY_HudsonRiverRegion_2020_A20/NY_HudsonRiverRegion_1_2020/reports/vendor_provided_xml/East_AOI_DEM.xml
    title: "Vendor FGDC metadata for NY_HudsonRiverRegion_1_2020"

