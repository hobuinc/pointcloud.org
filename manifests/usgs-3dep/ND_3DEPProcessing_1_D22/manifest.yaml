schema_version: 2

# USGS 3DEP acquisition, part of a five-state EPT batch ingest (ND, PA, NY,
# ME, MS). Selected because this workunit has both USGS EPT hosting and a
# WESM.csv row -- the dates, quality level, spec and CRS below all come from
# WESM, the point count from the workunit's own ept.json, and the producer
# from the vendor FGDC metadata. Workunits with EPT but no WESM row were
# deferred rather than published without acquisition dates.
type: Collection
stac_version: "1.0.0"
id: ND_3DEPProcessing_1_D22
title: North Dakota 3DEP Lidar — 3DEPProcessing 1 D22
description: >
  Classified airborne lidar point cloud collected 2019-05-31 through
  2021-04-10 by Fugro for the USGS 3D Elevation Program (3DEP) as part of
  the "ND_3DEPProcessing_D22" project (project ID 231611), acquired to QL 2
  meeting the USGS Lidar Base Specification 2022 Revision A. Approximately
  78,468,908,572 points. Served here directly from USGS's public Entwine
  Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage, so this Collection's single item streams
  live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [north-dakota, usgs, 3dep, lidar, entwine, ept, fugro]
providers:
  - name: Fugro
    roles: [producer]
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2019-05-31", "2021-04-10"]

"sci:citation": >
  Fugro (2019). ND_3DEPProcessing_D22; Project ID: 231611; Classified Point
  Cloud. U.S. Geological Survey 3D Elevation Program.

links:
  - rel: about
    href: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/metadata/ND_3DEPProcessing_D22/ND_3DEPProcessing_1_D22/reports/vendor_provided_xml/ND_3DEPProcessing_D22_Point_Cloud_XML_Metadata_UTM14.xml
    title: "Vendor FGDC metadata for ND_3DEPProcessing_1_D22"

