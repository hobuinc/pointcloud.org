schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). Base/IDIQ contract number is not disclosed in this
# workunit's XML, only the task-order string.
type: Collection
stac_version: "1.0.0"
id: MN_BeckerCo_1_2021
title: MN Becker County 1 2021 Lidar
description: >
  Classified airborne lidar point cloud collected 2022-05-15 through
  2022-09-18 by Merrick-Surdex Joint Venture, LLP for the USGS 3D Elevation
  Program (3DEP) as part of the "MN Becker County 1 2021" project, acquired at
  QL 1 spec meeting the USGS National Geospatial Program Base Lidar
  Specification (USGS Lidar Base Specification 2020 Revision A). Served here
  directly from USGS's public Entwine Point Tile (EPT) bucket via `ept_source`
  -- not copied into pointcloud.org's own storage, so this Collection's single
  item streams live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, becker-county, merrick-surdex]
providers:
