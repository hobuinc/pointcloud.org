    href: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/metadata/ME_MidCoast_2021_B21/ME_MidCoast_3_2021/reports/vendor_provided_xml/ME_MidCoast_B21_2021_WU300238_DEM.xml
    title: "Vendor FGDC metadata for ME_MidCoast_3_2021"

