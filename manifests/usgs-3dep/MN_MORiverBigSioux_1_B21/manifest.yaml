schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). Terrasurv, Inc. provided ground-control support as a
# subcontractor.
type: Collection
stac_version: "1.0.0"
id: MN_MORiverBigSioux_1_B21
title: MN Missouri River Big Sioux 1 2021 Lidar
description: >
  Classified airborne lidar point cloud collected 2022-04-27 through
  2022-05-23 by Fugro Geospatial, Inc. for the USGS 3D Elevation Program
  (3DEP) as part of the "MN Missouri River Big Sioux 1 2021" project, acquired
  at QL 1 spec meeting the USGS National Geospatial Program Base Lidar
  Specification (USGS Lidar Base Specification 2021 Revision A). Served here
  directly from USGS's public Entwine Point Tile (EPT) bucket via `ept_source`
  -- not copied into pointcloud.org's own storage, so this Collection's single
  item streams live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, missouri-river, big-sioux, fugro]
providers:
  - name: Fugro Geospatial, Inc.
    roles: [producer]
    url: https://www.fugro.com/
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2022-04-27", "2022-05-23"]

"sci:citation": >
  Fugro Geospatial, Inc. (2022). MN Missouri River Big Sioux 1 2021 Lidar;
  Project ID: 223446 - WU223443; Classified Point Cloud. U.S. Geological
  Survey 3D Elevation Program. USGS Contract No. G17PC00015.

