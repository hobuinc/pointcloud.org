schema_version: 2

# USGS 3DEP acquisition, Aerial Services, Inc. 2020, part of a
# 12-dataset Iowa batch ingest (all IA_* workunits except
# IA_FullState). Metadata cross-checked 2026-08-09 against the FGDC
# XML at the href in metadata_links below, USGS's WESM.csv, and the
# EPT resource's own ept.json. Ingested via `ept_source` -- see
# manifests/README.md.
type: Collection
stac_version: "1.0.0"
id: IA_NorthCentral_2_2020
title: IA North Central 2 2020 Lidar
description: >
  Classified airborne lidar point cloud covering approximately 6,132 square
  miles of the Iowa North Central project's Block 3 area -- Carroll, Greene,
  Guthrie, Boone, Dallas, Story, Polk, Marshall, Jasper, and Tama Counties
  -- collected April 2020 by Aerial Services, Inc. for the USGS 3D Elevation
  Program (3DEP) as part of the "IA NorthCentral 2020 D20" project. Acquired
  at QL2 spec (nominal pulse spacing 0.71m) meeting the USGS National
  Geospatial Program Base Lidar Specification, Version 2.1. Served here
  directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
