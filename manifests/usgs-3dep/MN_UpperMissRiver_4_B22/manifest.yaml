schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). Contract/task-order confirmed via sibling
# MN_UpperMissRiver_1_B22's FGDC XML (that sibling itself has no USGS EPT
# hosting and isn't ingested here); base/IDIQ contract number not disclosed.
type: Collection
stac_version: "1.0.0"
id: MN_UpperMissRiver_4_B22
title: MN Upper Mississippi River 4 2022 Lidar
description: >
  Classified airborne lidar point cloud collected 2022-06-09 through
  2023-05-20 by Merrick-Surdex Joint Venture, LLP for the USGS 3D Elevation
  Program (3DEP) as part of the "MN Upper Mississippi River 4 2022" project,
  acquired at QL 1 spec meeting the USGS National Geospatial Program Base
  Lidar Specification (USGS Lidar Base Specification 2021 Revision A). Served
  here directly from USGS's public Entwine Point Tile (EPT) bucket via
  `ept_source` -- not copied into pointcloud.org's own storage, so this
  Collection's single item streams live from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, upper-mississippi-river, merrick-surdex]
providers:
