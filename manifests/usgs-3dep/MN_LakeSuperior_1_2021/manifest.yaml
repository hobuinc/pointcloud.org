schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). Ayres Associates provided ground-control support as a
# subcontractor.
type: Collection
stac_version: "1.0.0"
id: MN_LakeSuperior_1_2021
title: MN Lake Superior 1 2021 Lidar
description: >
  Classified airborne lidar point cloud collected 2021-04-25 through
  2021-05-02 by NV5 Geospatial for the USGS 3D Elevation Program (3DEP) as
  part of the "MN Lake Superior 1 2021" project, acquired at QL 1 spec meeting
  the USGS National Geospatial Program Base Lidar Specification (USGS Lidar
  Base Specification 2020 Revision A). Served here directly from USGS's public
  Entwine Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage, so this Collection's single item streams live
  from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, lake-superior, nv5-geospatial]
providers:
  - name: NV5 Geospatial
    roles: [producer]
    url: https://www.nv5geospatial.com/
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2021-04-25", "2021-05-02"]

"sci:citation": >
  NV5 Geospatial (2021). MN Lake Superior 1 2021 Lidar; Project ID: 218910 -
  WU218907; Classified Point Cloud. U.S. Geological Survey 3D Elevation
  Program. USGS Contract No. G16PC00016, Task Order No. 140G0221F0113.

pointcloud_org:
