    href: https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/metadata/ME_SouthCentral_B22/ME_SouthCentral_1_B22/reports/vendor_provided_xml/ME_SouthCentral_B22_WU230147_DEM.xml
    title: "Vendor FGDC metadata for ME_SouthCentral_1_B22"

