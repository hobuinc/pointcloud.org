# USGS 3DEP acquisition, Woolpert 2021-2022. Re-triggered 2026-08-05 after
# a container fix (EPT resolution-bound fallback hardening) landed.
# Metadata cross-checked
# 2026-08-05 against the FGDC/ISO XML at
# https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/metadata/MN_SE_Driftless_2021_B21/MN_SEDriftless_3_2021/reports/vendor_provided_xml/MN%20SE%20Driftless%203%202021_WU228972_Classified_Point_Cloud_Metadata.xml
# and the EPT resource's own ept.json. First pointcloud.org dataset
# ingested via `ept_source` -- see manifests/README.md.
type: Collection
stac_version: "1.0.0"
id: MN_SEDriftless_3_2021
title: MN SE Driftless 3 2021 Lidar
description: >
  Classified airborne lidar point cloud covering approximately 1,838
  square miles of the southeast Minnesota driftless area (Fillmore,
  Freeborn, and Mower Counties), collected May 2021 through May 2022 by
  Woolpert for the USGS 3D Elevation Program (3DEP) as part of the "MN
  SE Driftless 2021 B21" project. Acquired at QL1 spec (aggregate
  nominal pulse spacing 0.35m, 8 points/m^2) meeting the USGS National
  Geospatial Program Base Lidar Specification, Version 2022 revision A.
  Served here directly from USGS's public Entwine Point Tile (EPT)
  bucket via `ept_source` -- not copied into pointcloud.org's own
  storage -- so this Collection's single item streams live from USGS's
  own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, driftless-area, entwine, ept, woolpert]
providers:
  - name: Woolpert
    roles: [producer]
    url: https://woolpert.com/
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
links:
