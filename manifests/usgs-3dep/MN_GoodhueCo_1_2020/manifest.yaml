schema_version: 2

# USGS 3DEP acquisition, part of a Minnesota batch ingest (83 MN_* workunits
# identified via WESM.csv; only 35 have USGS EPT hosting -- ingested in this
# pass; the other 48 pre-2018 legacy workunits have no Entwine-processed data
# and are deferred to a possible future federate-based pass -- see
# memory/PLAN.md). No USGS contract/task-order number is disclosed in the FGDC
# XML for this workunit -- verified by full-text search, not an oversight.
type: Collection
stac_version: "1.0.0"
id: MN_GoodhueCo_1_2020
title: MN Goodhue County 1 2020 Lidar
description: >
  Classified airborne lidar point cloud collected 2020-04-08 through
  2020-05-03 by Ayres Associates for the USGS 3D Elevation Program (3DEP) as
  part of the "MN Goodhue County 1 2020" project, acquired at QL 0 spec
  meeting the USGS National Geospatial Program Base Lidar Specification (USGS
  Lidar Base Specification 2.1). Served here directly from USGS's public
  Entwine Point Tile (EPT) bucket via `ept_source` -- not copied into
  pointcloud.org's own storage, so this Collection's single item streams live
  from USGS's own infrastructure.
license:
  id: "Public Domain (U.S. Government Work)"
  url: https://www.usgs.gov/faqs/what-are-terms-uselicensing-map-services-and-data-national-map
keywords: [minnesota, usgs, 3dep, lidar, entwine, ept, goodhue-county, ayres-associates]
providers:
  - name: Ayres Associates
    roles: [producer]
  - name: U.S. Geological Survey 3D Elevation Program (3DEP)
    roles: [licensor, host]
    url: https://www.usgs.gov/3d-elevation-program
    pointcloud_org:
      contact:
        name: Howard Butler
        email: howard@hobu.co
        github_owner: hobu
extent:
  temporal:
    interval:
      - ["2020-04-08", "2020-05-03"]

"sci:citation": >
  Ayres Associates (2020). MN Goodhue County 1 2020 Lidar; Project ID: 191388
  - WU191386; Classified Point Cloud. U.S. Geological Survey 3D Elevation
  Program.

