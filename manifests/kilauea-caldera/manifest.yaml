schema_version: 2

# Two epochs: 2009 (NCALM) and 2019 (source encoded as 'HMMQSI' in the filename -- meaning not confirmed).
# TODO: confirm license before publishing -- not yet verified for this dataset.
type: Collection
stac_version: 1.0.0
id: kilauea-caldera
title: Kilauea Caldera
description: "TODO: write a one-line summary for Kilauea Caldera"
license: UNKNOWN
keywords: [hawaii, volcano]
providers:
- name: NCALM
  roles: [producer]
  url: https://ncalm.cive.uh.edu/
  pointcloud_org:
    contact:
      name: Howard Butler
      email: howard@hobu.co
extent:
  temporal:
    interval:
    - - 2009-01-01
      - 2019-12-31
pointcloud_org:
  derivatives: true
  # Every asset below lives in our own Cloudflare R2 bucket, but this
  # is declared explicitly (rather than inferred from the "pointcloud"
  # bucket name) so every dataset uniformly states which S3-compatible
  # service+account hosts it -- AWS S3, this Cloudflare R2 account, or
  # someone else's bucket. Purely informational for this bucket: the
  # Worker always fetches "s3://pointcloud/..." via its native R2
  # binding, never over HTTP, so this value has no effect on fetching.
  default_endpoint: https://c88d624d8d8f065b1afce73bd44dcf1d.r2.cloudflarestorage.com
  viewer:
    enabled: true
    default_asset_id: 2009-kilauea-caldera-ncalm

items:
- id: 2009-kilauea-caldera-ncalm
  assets:
    data:
      href: s3://pointcloud/kilaueau/2009-kilauea-caldera-NCALM.copc.laz
      roles: [data]
  pointcloud_org:
    copc_resolution: 1
- id: 2019-kilauea-caldera-hmmqsi
  assets:
    data:
      href: s3://pointcloud/kilaueau/2019-kilauea-caldera-HMMQSI.copc.laz
      roles: [data]
  pointcloud_org:
    copc_resolution: 1
