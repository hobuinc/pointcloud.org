schema_version: 2

# USGS 3DEP lidar, Adams County, Wisconsin, 2019 acquisition (USGS_LPC_WI_Statewide_2019 tile series).
#
# 2026-08-03 (round 2, after fixing the Cloudflare Queues 128KB message
# cap in handleTrigger/handleIngestRequest): re-verifying end-to-end.
#
# 2026-08-03: real end-to-end verification that a dataset this large
# (~1,026 hand-authored assets) can go through validate -> dispatch ->
# receive-manifest-dispatch -> POST /trigger without hitting GitHub's
# repository_dispatch client_payload size limit -- this dataset alone
# is exactly what first exposed that bug.
type: Collection
stac_version: 1.0.0
id: wi-adams-2019
title: Wisconsin Adams County Lidar 2019
description: "TODO: write a one-line summary for Wisconsin Adams County Lidar 2019"
license:
