schema_version: 1

# USGS 3DEP lidar, Adams County, Wisconsin, 2019 acquisition (USGS_LPC_WI_Statewide_2019 tile series).
# TODO: confirm license before publishing -- not yet verified for this dataset.
#
# 2026-08-03 (round 2, after fixing the Cloudflare Queues 128KB message
# cap in handleTrigger/handleIngestRequest): re-verifying end-to-end.
#
# 2026-08-03: real end-to-end verification that a dataset this large
# (~1,026 hand-authored assets) can go through validate -> dispatch ->
# receive-manifest-dispatch -> POST /trigger without hitting GitHub's
# repository_dispatch client_payload size limit -- this dataset alone
# is exactly what first exposed that bug.
dataset:
  id: wi-adams-2019
  title: Wisconsin Adams County Lidar 2019
  summary: "TODO: write a one-line summary for Wisconsin Adams County Lidar 2019"
  license: UNKNOWN
  derivatives: true
  # Every asset below lives in our own Cloudflare R2 bucket, but this
  # is declared explicitly (rather than inferred from the "pointcloud"
  # bucket name) so every dataset uniformly states which S3-compatible
  # service+account hosts it -- AWS S3, this Cloudflare R2 account, or
  # someone else's bucket. Purely informational for this bucket: the
  # Worker always fetches "s3://pointcloud/..." via its native R2
  # binding, never over HTTP, so this value has no effect on fetching.
  default_endpoint: https://c88d624d8d8f065b1afce73bd44dcf1d.r2.cloudflarestorage.com
  providers:
    - organization:
        name: USGS
      contact:
        name: Howard Butler
        email: howard@hobu.co
      roles: [producer, licensor]
      url: https://www.usgs.gov/
  tags: [usgs, wisconsin, 3dep]
  temporal:
    start: 2019-01-01
  viewer:
    enabled: true
    default_asset_id: a19-0001

