  # Worker always fetches "s3://pointcloud/..." via its native R2
  # binding, never over HTTP, so this value has no effect on fetching.
  default_endpoint: https://c88d624d8d8f065b1afce73bd44dcf1d.r2.cloudflarestorage.com
